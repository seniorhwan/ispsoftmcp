<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISPSoft MCP Agent Server</title>
  <meta name="description" content="Full-featured AI-agent MCP server and offline/simulator workbench for Delta ISPSoft PLCs (DVP &amp; AS series)." />
  <meta property="og:title" content="ISPSoft MCP Agent Server" />
  <meta property="og:description" content="Full-featured AI-agent MCP server and offline/simulator workbench for Delta ISPSoft PLCs (DVP &amp; AS series)." />
  <style>
    :root { color-scheme: dark; --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --ok: #3fb950; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }
    header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .endpoint { font-size: 12px; color: var(--muted); }
    .endpoint code { color: var(--accent); background: #0d1117; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; }
    main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 54px); }
    aside { border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; background: #0d1117; }
    .cat { margin-bottom: 14px; }
    .cat-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; }
    .tool-btn { width: 100%; text-align: left; background: transparent; color: var(--text); border: 1px solid transparent; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; display: block; }
    .tool-btn:hover { background: var(--panel); border-color: var(--border); }
    .tool-btn.active { background: #1f2937; border-color: var(--accent); color: var(--accent); }
    section { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
    textarea, input, select { width: 100%; background: #0d1117; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-family: inherit; font-size: 12px; }
    textarea { min-height: 140px; resize: vertical; }
    button.primary { background: #238636; color: #fff; border: 1px solid #2ea043; border-radius: 4px; padding: 7px 14px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 12px; }
    button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: 12px; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; background: #0d1117; border: 1px solid var(--border); border-radius: 4px; padding: 10px; max-height: 420px; overflow-y: auto; font-size: 12px; }
    .muted { color: var(--muted); font-size: 12px; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; height: auto; } aside { max-height: 260px; border-right: none; border-bottom: 1px solid var(--border); } }
  </style>
</head>
<body>
  <header>
    <h1>ISPSoft MCP Agent Server</h1>
    <div class="endpoint">
      MCP JSON-RPC: <code id="mcpUrl">/mcp</code> &middot;
      Discovery: <code>GET /mcp</code> &middot;
      REST: <code>POST /api/tools/:name</code>
    </div>
  </header>
  <main>
    <aside id="toolList"></aside>
    <section>
      <div class="card">
        <div class="row" style="justify-content: space-between;">
          <div>
            <strong id="toolName">Select a tool</strong>
            <div id="toolDesc" class="muted">Loading MCP tool catalog...</div>
          </div>
          <div class="row">
            <label class="secondary" style="cursor:pointer;">
              Upload .isp/.mpu
              <input id="fileUpload" type="file" accept=".isp,.bak,.mpu" style="display:none" />
            </label>
            <button class="secondary" id="refreshFilesBtn">Workspace Files</button>
          </div>
        </div>
      </div>

      <div class="card">
        <label for="argsInput" class="muted" style="display:block;margin-bottom:6px;">Arguments JSON (<code>params.arguments</code>)</label>
        <textarea id="argsInput" aria-label="MCP tool arguments JSON">{}</textarea>
        <div class="row" style="margin-top:8px;">
          <button class="primary" id="runBtn">Execute MCP Tool (POST /mcp)</button>
          <span id="statusText" class="muted"></span>
        </div>
      </div>

      <div class="card">
        <div class="muted" style="margin-bottom:6px;">Response</div>
        <pre id="outputBox">{}</pre>
      </div>
    </section>
  </main>

  <script>
    const SAMPLES = {
      ispsoft_list_projects: {},
      ispsoft_server_telemetry: {},
      ispsoft_export_project_bundle: { project_path: '/workspace/sample_es2.isp', include_ascii: true },
      ispsoft_apply_project_transaction: {
        project_path: '/workspace/sample_es2.isp',
        in_place: false,
        operations: [
          { type: 'write_comments', device_comments: { Y1: 'Cooling Fan' } },
          { type: 'edit_ld_rungs', pou_name: 'Prog0', operations: [{ op: 'append', il_program: 'LD M10\nOUT Y1' }] },
        ],
        dry_run: true,
      },
      ispsoft_audit_project: { project_path: '/workspace/sample_es2.isp' },
      ispsoft_search_project: { project_path: '/workspace/sample_es2.isp', query: 'M10' },
      ispsoft_create_blank_project: { model: 'ES2', output_path: '/workspace/conveyor.isp', initial_pou_name: 'MainLD', language: 'LD' },
      ispsoft_get_project_overview: { project_path: '/workspace/sample_es2.isp' },
      ispsoft_render_ld_ascii: { project_path: '/workspace/sample_es2.isp', pou_name: 'Prog0' },
      ispsoft_edit_ld_rungs: { project_path: '/workspace/sample_es2.isp', pou_name: 'Prog0', operations: [{ op: 'append', il_program: 'LD M10\nOUT Y1' }], dry_run: true },
      ispsoft_static_check_and_compile: { project_path: '/workspace/sample_es2.isp' },
      ispsoft_project_cross_references: { project_path: '/workspace/sample_es2.isp' },
      ispsoft_sim_start: { project_path: '/workspace/sample_es2.isp', scan_interval_ms: 100 },
      ispsoft_sim_force_and_write: { session_id: 'sim-1', force_bits: { X0: true } },
      ispsoft_sim_control: { session_id: 'sim-1', command: 'STEP', cycles: 5 },
      ispsoft_sim_step_until: { session_id: 'sim-1', condition: 'T0.Q', max_cycles: 100 },
      ispsoft_sim_run_sequence: {
        session_id: 'sim-1',
        steps: [
          { label: 'Start motor', force_bits: { X0: true }, cycles: 1, expect: { Y0: true } },
          { label: 'Wait timer T0', step_until: 'T0.Q', max_cycles: 60, expect: { M10: true, D10: 1 } },
        ],
      },
      ispsoft_sim_memory_dump: { session_id: 'sim-1', area: 'D', start: 0, count: 25, only_non_zero: true },
      ispsoft_sim_breakpoints: { session_id: 'sim-1', action: 'add', expr: 'D10 >= 2' },
      ispsoft_sim_monitor: { session_id: 'sim-1', addresses: ['X0', 'Y0', 'T0', 'M10', 'D10', 'D100'], compact: true },
      ispsoft_sim_watch_table: { session_id: 'sim-1', action: 'trace', table_name: 'default' },
      ispsoft_sim_diagnostics: { session_id: 'sim-1', sample_cycles: 25, include_recent_scans: true },
      ispsoft_validate_il: { model: 'ES2', pou_name: 'Prog0', program: 'LD X0\nOR M0\nANI X1\nOUT Y0\nLD Y0\nTMR T0 K50' },
      ispsoft_map_dvp_modbus_addresses: { model: 'DVP32ES2T', addresses: ['X0', 'Y0', 'M0', 'T0', 'C200', 'D7000'] },
    };

    document.getElementById('mcpUrl').textContent = window.location.origin + '/mcp';
    let tools = [];
    let selected = null;

    async function loadTools() {
      const res = await fetch('/api/tools');
      const data = await res.json();
      tools = data.tools || [];
      const groups = new Map();
      for (const t of tools) {
        if (!groups.has(t.category)) groups.set(t.category, []);
        groups.get(t.category).push(t);
      }
      const list = document.getElementById('toolList');
      list.innerHTML = '';
      for (const [cat, items] of groups.entries()) {
        const div = document.createElement('div');
        div.className = 'cat';
        const title = document.createElement('div');
        title.className = 'cat-title';
        title.textContent = `${cat} (${items.length})`;
        div.appendChild(title);
        for (const t of items) {
          const btn = document.createElement('button');
          btn.className = 'tool-btn';
          btn.textContent = t.name;
          btn.onclick = () => selectTool(t, btn);
          div.appendChild(btn);
        }
        list.appendChild(div);
      }
      if (tools.length) selectTool(tools[0], list.querySelector('.tool-btn'));
    }

    function selectTool(tool, btn) {
      selected = tool;
      document.querySelectorAll('.tool-btn').forEach((b) => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.getElementById('toolName').textContent = tool.name;
      document.getElementById('toolDesc').textContent = tool.description;
      const sample = SAMPLES[tool.name] ?? {};
      document.getElementById('argsInput').value = JSON.stringify(sample, null, 2);
    }

    async function runSelected() {
      if (!selected) return;
      const status = document.getElementById('statusText');
      const output = document.getElementById('outputBox');
      try {
        const args = JSON.parse(document.getElementById('argsInput').value || '{}');
        status.textContent = 'Running...';
        const res = await fetch('/mcp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: '2.0',
            id: Date.now(),
            method: 'tools/call',
            params: { name: selected.name, arguments: args },
          }),
        });
        const rpc = await res.json();
        const text = rpc?.result?.content?.[0]?.text;
        output.textContent = text ? text : JSON.stringify(rpc, null, 2);
        status.textContent = rpc?.result?.isError ? 'Returned error' : 'OK';
      } catch (e) {
        status.textContent = 'Invalid JSON or request error';
        output.textContent = String(e);
      }
    }

    document.getElementById('runBtn').onclick = runSelected;
    document.getElementById('refreshFilesBtn').onclick = () => {
      const t = tools.find((x) => x.name === 'ispsoft_list_projects');
      if (t) { selectTool(t, null); runSelected(); }
    };
    document.getElementById('fileUpload').onchange = async (ev) => {
      const file = ev.target.files?.[0];
      if (!file) return;
      const buf = new Uint8Array(await file.arrayBuffer());
      let bin = '';
      for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
      const res = await fetch('/api/projects/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: '/workspace/' + file.name, content_base64: btoa(bin), overwrite: true }),
      });
      document.getElementById('outputBox').textContent = JSON.stringify(await res.json(), null, 2);
    };

    loadTools();
  </script>
</body>
</html>
